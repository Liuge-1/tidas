<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TIDAS 培训管理系统 - 登录</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 50%, #1e293b 100%);
            display: flex; align-items: center; justify-content: center; overflow: hidden;
        }
        .bg-shapes { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 0; }
        .shape { position: absolute; border-radius: 50%; opacity: 0.06; }
        .shape1 { width: 500px; height: 500px; background: #4f6ef7; top: -150px; right: -100px; }
        .shape2 { width: 300px; height: 300px; background: #764ba2; bottom: -80px; left: -60px; }
        .shape3 { width: 200px; height: 200px; background: #22c55e; top: 40%; left: 10%; }
        .login-wrapper { position: relative; z-index: 1; width: 420px; }
        .login-card {
            background: rgba(255,255,255,0.95); backdrop-filter: blur(10px);
            border-radius: 20px; box-shadow: 0 25px 60px rgba(0,0,0,0.4); padding: 48px 40px;
        }
        .logo-area { text-align: center; margin-bottom: 28px; }
        .logo-icon {
            width: 60px; height: 60px; background: linear-gradient(135deg, #4f6ef7, #764ba2);
            border-radius: 16px; display: inline-flex; align-items: center; justify-content: center;
            font-size: 28px; margin-bottom: 16px; box-shadow: 0 8px 24px rgba(79,110,247,0.35);
        }
        .login-title { font-size: 24px; font-weight: 700; color: #1e293b; letter-spacing: -0.5px; }
        .login-subtitle { font-size: 13px; color: #94a3b8; margin-top: 6px; }
        .role-switch {
            display: flex; background: #f1f5f9; border-radius: 10px; padding: 4px;
            margin-bottom: 24px; gap: 4px;
        }
        .role-btn {
            flex: 1; padding: 10px; border: none; border-radius: 8px;
            font-size: 14px; font-weight: 500; cursor: pointer;
            transition: all 0.3s ease; background: transparent; color: #64748b;
        }
        .role-btn.active { background: #fff; color: #4f6ef7; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-item { margin-bottom: 20px; position: relative; }
        .form-item .input-icon {
            position: absolute; left: 16px; top: 50%; transform: translateY(-50%);
            font-size: 18px; color: #94a3b8; z-index: 1; pointer-events: none;
        }
        .form-item input {
            width: 100%; height: 50px; padding: 0 16px 0 46px;
            border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px;
            color: #1e293b; background: #f8fafc; transition: all 0.3s ease; outline: none;
        }
        .form-item input:focus {
            border-color: #4f6ef7; background: #fff; box-shadow: 0 0 0 4px rgba(79,110,247,0.08);
        }
        .form-item input::placeholder { color: #cbd5e1; }
        .login-btn {
            width: 100%; height: 50px; border: none; border-radius: 12px;
            background: linear-gradient(135deg, #4f6ef7 0%, #764ba2 100%);
            color: white; font-size: 16px; font-weight: 600; cursor: pointer;
            transition: all 0.3s ease; letter-spacing: 1px; margin-top: 8px;
            box-shadow: 0 8px 24px rgba(79,110,247,0.3);
        }
        .login-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 32px rgba(79,110,247,0.45); }
        .login-btn:active { transform: translateY(0); }
        .error-msg { color: #ef4444; text-align: center; margin-top: 16px; font-size: 13px; min-height: 20px; }
        .success-msg { color: #22c55e; text-align: center; margin-top: 16px; font-size: 13px; min-height: 20px; }
        .footer-text { text-align: center; color: #94a3b8; font-size: 12px; margin-top: 24px; }
        .toggle-link { text-align: center; margin-top: 16px; font-size: 13px; color: #4f6ef7; cursor: pointer; }
        .toggle-link:hover { text-decoration: underline; }
        /* 注册表单 */
        .form-row { display: flex; gap: 12px; }
        .form-row .form-item { flex: 1; }
        .form-item select {
            width: 100%; height: 50px; padding: 0 16px 0 46px;
            border: 2px solid #e2e8f0; border-radius: 12px; font-size: 15px;
            color: #1e293b; background: #f8fafc; transition: all 0.3s ease; outline: none;
            appearance: none; cursor: pointer;
        }
        .form-item select:focus {
            border-color: #4f6ef7; background: #fff; box-shadow: 0 0 0 4px rgba(79,110,247,0.08);
        }
        .login-card.register-card { max-height: 90vh; overflow-y: auto; }
    </style>
</head>
<body>
<div class="bg-shapes">
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>
</div>
<div class="login-wrapper">
    <div class="login-card" id="loginCard">
        <!-- ===== 登录表单 ===== -->
        <div id="loginForm">
            <div class="logo-area">
                <div class="logo-icon">📚</div>
                <h2 class="login-title">TIDAS 培训管理系统</h2>
                <p class="login-subtitle">管理员 / 员工 统一登录</p>
            </div>
            <div class="form-item">
                <span class="input-icon">👤</span>
                <input type="text" id="username" placeholder="请输入账号" autocomplete="off">
            </div>
            <div class="form-item">
                <span class="input-icon">🔒</span>
                <input type="password" id="password" placeholder="请输入密码">
            </div>
            <button class="login-btn" onclick="login()">登 录</button>
            <div class="error-msg" id="errorMsg"></div>
            <div class="toggle-link" style="display:flex;justify-content:space-between;">
                <span onclick="showForgot()">忘记密码？</span>
                <span onclick="showRegister()">还没有账号？立即注册 →</span>
            </div>
            <div class="footer-text">© 2026 TIDAS v2.0</div>
        </div>

        <!-- ===== 忘记密码表单（默认隐藏） ===== -->
        <div id="forgotForm" style="display:none;">
            <div class="logo-area">
                <div class="logo-icon">🔑</div>
                <h2 class="login-title">找回账号 / 重置密码</h2>
                <p class="login-subtitle">通过绑定的QQ邮箱验证身份</p>
            </div>
            <!-- 找回的用户名提示 -->
            <div id="foundUsername" style="display:none;background:#f0fdf4;border:1px solid #bbf7d0;border-radius:8px;padding:10px 14px;margin-bottom:16px;text-align:center;font-size:13px;color:#166534;"></div>
            <div id="forgotErrorMsg" class="error-msg"></div>
            <div class="form-item">
                <span class="input-icon">📧</span>
                <input type="email" id="forgotEmail" placeholder="请输入绑定的QQ邮箱（@qq.com）" autocomplete="off">
            </div>
            <div class="form-item" style="display:flex;gap:8px;">
                <span class="input-icon">🔑</span>
                <input type="text" id="forgotCode" placeholder="请输入验证码" style="flex:1;padding-left:46px;" autocomplete="off">
                <button id="forgotSendCodeBtn" class="login-btn" onclick="forgotSendCode()" style="width:130px;height:50px;margin-top:0;font-size:13px;letter-spacing:0;flex-shrink:0;">发送验证码</button>
            </div>
            <!-- 重置密码时显示的新密码框（默认隐藏） -->
            <div id="resetPwdArea" style="display:none;">
                <div class="form-item">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="newPassword" placeholder="请输入新密码（至少6位）">
                </div>
                <div class="form-item">
                    <span class="input-icon">🔒</span>
                    <input type="password" id="confirmPassword" placeholder="请再次输入新密码">
                </div>
            </div>
            <!-- 操作按钮 -->
            <button id="forgotLoginBtn" class="login-btn" onclick="loginByCode()">验证码登录</button>
            <button id="forgotResetBtn" class="login-btn" onclick="resetPassword()" style="display:none;background:linear-gradient(135deg,#f59e0b,#ef4444);box-shadow:0 8px 24px rgba(245,158,11,0.3);">重置密码</button>
            <div class="toggle-link" style="display:flex;justify-content:space-between;margin-top:12px;">
                <span onclick="showLogin()">← 返回登录</span>
                <span id="toggleResetMode" onclick="toggleResetMode()" style="color:#f59e0b;">重置密码 →</span>
            </div>
            <div class="footer-text">© 2026 TIDAS v2.0</div>
        </div>

        <!-- ===== 注册表单（默认隐藏） ===== -->
        <div id="registerForm" style="display:none;">
            <div class="logo-area">
                <div class="logo-icon">📝</div>
                <h2 class="login-title">注册新账号</h2>
                <p class="login-subtitle">所有新注册账号默认为员工</p>
            </div>
            <div class="form-item">
                <span class="input-icon">👤</span>
                <input type="text" id="regUsername" placeholder="请输入登录账号" autocomplete="off">
            </div>
            <div class="form-item">
                <span class="input-icon">🔒</span>
                <input type="password" id="regPassword" placeholder="请设置密码">
            </div>
            <div class="form-item">
                <span class="input-icon">📧</span>
                <input type="email" id="regEmail" placeholder="请输入QQ邮箱（@qq.com）" autocomplete="off">
            </div>
            <div class="form-item" style="display:flex;gap:8px;">
                <span class="input-icon">🔑</span>
                <input type="text" id="regCode" placeholder="请输入验证码" style="flex:1;padding-left:46px;" autocomplete="off">
                <button id="sendCodeBtn" class="login-btn" onclick="sendCode()" style="width:130px;height:50px;margin-top:0;font-size:13px;letter-spacing:0;flex-shrink:0;">发送验证码</button>
            </div>
            <button class="login-btn" onclick="register()">注 册</button>
            <div class="error-msg" id="regErrorMsg"></div>
            <div class="toggle-link" onclick="showLogin()">← 已有账号？返回登录</div>
            <div class="footer-text">© 2026 TIDAS v2.0</div>
        </div>
    </div>
</div>
<script>
    // ===== 登录/注册/忘记密码 切换 =====
    function showRegister() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('forgotForm').style.display = 'none';
        document.getElementById('registerForm').style.display = '';
        document.getElementById('regErrorMsg').textContent = '';
        document.getElementById('errorMsg').textContent = '';
        loadJobs();
    }

    function showLogin() {
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('forgotForm').style.display = 'none';
        document.getElementById('loginForm').style.display = '';
        document.getElementById('errorMsg').textContent = '';
        document.getElementById('regErrorMsg').textContent = '';
        document.getElementById('forgotErrorMsg').textContent = '';
    }

    function showForgot() {
        document.getElementById('loginForm').style.display = 'none';
        document.getElementById('registerForm').style.display = 'none';
        document.getElementById('forgotForm').style.display = '';
        document.getElementById('forgotErrorMsg').textContent = '';
        document.getElementById('forgotErrorMsg').style.color = '#ef4444';
        document.getElementById('foundUsername').style.display = 'none';
        document.getElementById('resetPwdArea').style.display = 'none';
        document.getElementById('forgotLoginBtn').style.display = '';
        document.getElementById('forgotResetBtn').style.display = 'none';
        document.getElementById('toggleResetMode').textContent = '重置密码 →';
        document.getElementById('toggleResetMode').style.color = '#f59e0b';
        // 清空输入
        document.getElementById('forgotEmail').value = '';
        document.getElementById('forgotCode').value = '';
        document.getElementById('newPassword').value = '';
        document.getElementById('confirmPassword').value = '';
        forgotResetMode = false;
    }

    // ===== 加载已有职位 =====
    async function loadJobs() {
        const select = document.getElementById('regJob');
        try {
            const res = await fetch('/jobs');
            const result = await res.json();
            if (result.code === 1 && result.data && result.data.length > 0) {
                select.innerHTML = '<option value="">请选择职位</option>' +
                    result.data.map(j => `<option value="${j}">${j}</option>`).join('');
            } else {
                select.innerHTML = '<option value="">暂无可用职位</option>';
            }
        } catch(e) {
            select.innerHTML = '<option value="">加载失败，请刷新重试</option>';
        }
    }

    // ===== 发送验证码 =====
    let codeCountdown = 0;
    async function sendCode() {
        const email = document.getElementById('regEmail').value.trim();
        const errEl = document.getElementById('regErrorMsg');
        errEl.style.color = '#ef4444';

        if (!email) { errEl.textContent = '请输入邮箱'; return; }
        if (!email.endsWith('@qq.com')) { errEl.textContent = '目前仅支持QQ邮箱（@qq.com）'; return; }
        if (codeCountdown > 0) return;

        const btn = document.getElementById('sendCodeBtn');
        try {
            btn.disabled = true;
            btn.textContent = '发送中...';
            const res = await fetch('/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, purpose: 'register' })
            });
            const result = await res.json();
            if (result.code === 1) {
                errEl.style.color = '#22c55e';
                errEl.textContent = '✅ ' + result.msg;
                // 60秒倒计时
                codeCountdown = 60;
                btn.textContent = codeCountdown + 's后重发';
                const timer = setInterval(() => {
                    codeCountdown--;
                    btn.textContent = codeCountdown + 's后重发';
                    if (codeCountdown <= 0) {
                        clearInterval(timer);
                        btn.textContent = '发送验证码';
                        btn.disabled = false;
                    }
                }, 1000);
            } else {
                btn.textContent = '发送验证码';
                btn.disabled = false;
                errEl.textContent = result.msg || '发送失败';
            }
        } catch(e) {
            btn.textContent = '发送验证码';
            btn.disabled = false;
            errEl.textContent = '发送失败，请检查网络';
        }
    }

    // ===== 注册（只需 用户名 + 密码 + 邮箱 + 验证码） =====
    async function register() {
        const username = document.getElementById('regUsername').value.trim();
        const password = document.getElementById('regPassword').value.trim();
        const email = document.getElementById('regEmail').value.trim();
        const code = document.getElementById('regCode').value.trim();
        const errEl = document.getElementById('regErrorMsg');
        errEl.style.color = '#ef4444';

        if (!username) { errEl.textContent = '请输入登录账号'; return; }
        if (!password) { errEl.textContent = '请设置密码'; return; }
        if (!email) { errEl.textContent = '请输入QQ邮箱'; return; }
        if (!email.endsWith('@qq.com')) { errEl.textContent = '目前仅支持QQ邮箱（@qq.com）'; return; }
        if (!code) { errEl.textContent = '请输入验证码'; return; }

        try {
            const res = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, email, code })
            });
            const result = await res.json();
            if (result.code === 1) {
                errEl.style.color = '#22c55e';
                errEl.textContent = '✅ 注册成功！即将跳转到登录...';
                setTimeout(() => {
                    document.getElementById('username').value = username;
                    showLogin();
                    errEl.style.color = '#ef4444';
                    errEl.textContent = '';
                    document.getElementById('errorMsg').textContent = '注册成功，请登录';
                }, 1500);
            } else {
                errEl.textContent = result.msg || '注册失败';
            }
        } catch(e) {
            errEl.textContent = '后端连接失败！请检查服务是否启动';
        }
    }

    // ===== 忘记密码：发送验证码 =====
    let forgotCodeCountdown = 0;
    let forgotResetMode = false;

    async function forgotSendCode() {
        const email = document.getElementById('forgotEmail').value.trim();
        const errEl = document.getElementById('forgotErrorMsg');
        errEl.style.color = '#ef4444';

        if (!email) { errEl.textContent = '请输入邮箱'; return; }
        if (!email.endsWith('@qq.com')) { errEl.textContent = '目前仅支持QQ邮箱（@qq.com）'; return; }
        if (forgotCodeCountdown > 0) return;

        const btn = document.getElementById('forgotSendCodeBtn');
        const purpose = forgotResetMode ? 'reset-password' : 'login';
        try {
            btn.disabled = true;
            btn.textContent = '发送中...';
            const res = await fetch('/send-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, purpose })
            });
            const result = await res.json();
            if (result.code === 1) {
                errEl.style.color = '#22c55e';
                errEl.textContent = '✅ ' + result.msg;
                // 尝试查找该邮箱对应的用户名
                tryLookupUsername(email);
                // 60秒倒计时
                forgotCodeCountdown = 60;
                btn.textContent = forgotCodeCountdown + 's后重发';
                const timer = setInterval(() => {
                    forgotCodeCountdown--;
                    btn.textContent = forgotCodeCountdown + 's后重发';
                    if (forgotCodeCountdown <= 0) {
                        clearInterval(timer);
                        btn.textContent = '发送验证码';
                        btn.disabled = false;
                    }
                }, 1000);
            } else {
                btn.textContent = '发送验证码';
                btn.disabled = false;
                errEl.textContent = result.msg || '发送失败';
            }
        } catch(e) {
            btn.textContent = '发送验证码';
            btn.disabled = false;
            errEl.textContent = '发送失败，请检查网络';
        }
    }

    // 尝试通过邮箱查找用户名
    async function tryLookupUsername(email) {
        try {
            const res = await fetch('/find-username', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email })
            });
            const result = await res.json();
            const el = document.getElementById('foundUsername');
            if (result.code === 1 && result.data) {
                el.textContent = '📧 该邮箱绑定的账号：' + result.data;
                el.style.display = '';
            } else {
                el.style.display = 'none';
            }
        } catch(e) {
            // 忽略查找失败
        }
    }

    // 切换重置密码模式
    function toggleResetMode() {
        forgotResetMode = !forgotResetMode;
        const resetArea = document.getElementById('resetPwdArea');
        const loginBtn = document.getElementById('forgotLoginBtn');
        const resetBtn = document.getElementById('forgotResetBtn');
        const toggleLink = document.getElementById('toggleResetMode');
        const errEl = document.getElementById('forgotErrorMsg');

        if (forgotResetMode) {
            resetArea.style.display = '';
            loginBtn.style.display = 'none';
            resetBtn.style.display = '';
            toggleLink.textContent = '← 验证码登录';
            toggleLink.style.color = '#4f6ef7';
        } else {
            resetArea.style.display = 'none';
            loginBtn.style.display = '';
            resetBtn.style.display = 'none';
            toggleLink.textContent = '重置密码 →';
            toggleLink.style.color = '#f59e0b';
        }
        errEl.textContent = '';
    }

    // 邮箱+验证码直接登录
    async function loginByCode() {
        const email = document.getElementById('forgotEmail').value.trim();
        const code = document.getElementById('forgotCode').value.trim();
        const errEl = document.getElementById('forgotErrorMsg');
        errEl.style.color = '#ef4444';

        if (!email) { errEl.textContent = '请输入邮箱'; return; }
        if (!code) { errEl.textContent = '请输入验证码'; return; }

        try {
            const res = await fetch('/login-by-code', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code })
            });
            const result = await res.json();
            if (result.code === 1) {
                const token = result.data.token || result.data;
                const name = result.data.name || '';
                const role = result.data.role || 'emp';
                const refreshToken = result.data.refreshToken;

                sessionStorage.setItem('token', token);
                sessionStorage.setItem('userName', name);
                sessionStorage.setItem('username', result.data.username || '');
                sessionStorage.setItem('userId', result.data.id);
                sessionStorage.setItem('role', role);
                if (refreshToken) sessionStorage.setItem('refreshToken', refreshToken);

                location.href = role === 'admin' ? 'admin.html' : 'employee.html';
            } else {
                errEl.textContent = result.msg || '验证码登录失败';
            }
        } catch(e) {
            errEl.textContent = '后端连接失败！请检查服务是否启动';
        }
    }

    // 通过邮箱验证码重置密码
    async function resetPassword() {
        const email = document.getElementById('forgotEmail').value.trim();
        const code = document.getElementById('forgotCode').value.trim();
        const newPassword = document.getElementById('newPassword').value.trim();
        const confirmPassword = document.getElementById('confirmPassword').value.trim();
        const errEl = document.getElementById('forgotErrorMsg');
        errEl.style.color = '#ef4444';

        if (!email) { errEl.textContent = '请输入邮箱'; return; }
        if (!code) { errEl.textContent = '请输入验证码'; return; }
        if (!newPassword) { errEl.textContent = '请输入新密码'; return; }
        if (newPassword.length < 6) { errEl.textContent = '新密码长度不能少于6位'; return; }
        if (newPassword !== confirmPassword) { errEl.textContent = '两次输入的密码不一致'; return; }

        try {
            const res = await fetch('/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, code, newPassword })
            });
            const result = await res.json();
            if (result.code === 1) {
                errEl.style.color = '#22c55e';
                errEl.textContent = '✅ 密码重置成功！3秒后返回登录页...';
                setTimeout(() => {
                    // 自动填入邮箱方便用户登录
                    showLogin();
                }, 3000);
            } else {
                errEl.textContent = result.msg || '密码重置失败';
            }
        } catch(e) {
            errEl.textContent = '后端连接失败！请检查服务是否启动';
        }
    }

    // ===== 登录 =====
    async function login() {
        const username = document.getElementById("username").value.trim();
        const password = document.getElementById("password").value.trim();
        if (!username || !password) {
            document.getElementById("errorMsg").textContent = "账号和密码不能为空！";
            return;
        }
        try {
            const res = await fetch("/login", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });
            const result = await res.json();
            if (result.code === 1) {
                const token = result.data.token || result.data;
                const name = result.data.name || username;
                const role = result.data.role || 'emp';
                const refreshToken = result.data.refreshToken;

                sessionStorage.setItem("token", token);
                sessionStorage.setItem("userName", name);
                sessionStorage.setItem("username", result.data.username || '');
                sessionStorage.setItem("userId", result.data.id);
                sessionStorage.setItem("role", role);
                if (refreshToken) {
                    sessionStorage.setItem("refreshToken", refreshToken);
                }
                // admin 角色默认进管理端，emp 角色进员工端
                location.href = role === 'admin' ? 'admin.html' : 'employee.html';
            } else {
                document.getElementById("errorMsg").textContent = result.msg || "登录失败";
            }
        } catch (err) {
            document.getElementById("errorMsg").textContent = "后端连接失败！请检查服务是否启动";
        }
    }
</script>
</body>
</html>
